services:
  postgres:
    image: postgres:16
    env_file:
      - ./compose/.env.keycloak
    volumes:
      - devops_final_backend_keycloak-db-data:/var/lib/postgresql/data
    networks:
      - devops-final
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--health-enabled=true", "--metrics-enabled=true"]
    env_file:
      - ./compose/.env.keycloak
    ports:
      - 8080:8080
      - 9000:9000
    networks:
      - devops-final
    depends_on:
      postgres:
        condition: service_healthy

  devops_final_backend:
    image: tudor0h/devops_final_backend:latest
    env_file:
      - ./compose/.env.devops_final_backend
    ports:
      - 8000:80
    networks:
      - devops-final
    depends_on:
      - keycloak

  devops_final_fronted:
    image: tudor0h/devops_final_frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./compose/.env.devops_final_frontend
    ports:
      - 8501:8501
    networks:
      - devops-final
    depends_on:
      - keycloak
      - devops_final_backend

volumes:
  devops_final_backend_keycloak-db-data:
    external: true

networks:
  devops-final:
    driver: bridge
