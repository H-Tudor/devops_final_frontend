[project]
name = "devops-final-frontend"
version = "0.1.0"
description = "A user-friendly UI for the LLM Generator API"
readme = "README.md"
authors = [
    { name = "Tudor Huza", email = "huzatudor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "streamlit[auth]>=1.50.0",
]

[project.scripts]
devops-final-frontend = "devops_final_frontend:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
fix = true
lint.extend-select = ["I"]

[tool.pylint]
ignore = ["venv", ".env", "build", "dist"]
disable = [
    "C0114",  # missing-module-docstring
    # "C0115",  # missing-class-docstring
    # "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0801",  # duplicate-code
    # "R1732",  # consider-using-with
    "W0621",  # redefined-outer-name
    "W0104",  # pointless-statement
]
output-format = "colorized"
# reports = false
# score = false
good-names = ["i", "j", "k", "ex", "Run", "_"]
max-line-length = 120
extension-pkg-whitelist = ["pydantic"]
ignored-modules = ["typing_extensions"]

[dependency-groups]
dev = [
    "pylint>=4.0.0",
    "ruff>=0.14.0",
]
