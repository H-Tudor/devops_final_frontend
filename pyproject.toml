[project]
name = "devops-final-frontend"
version = "0.3.0"
description = "A user-friendly UI for the LLM Generator API"
readme = "README.md"
authors = [
    { name = "Tudor Huza", email = "huzatudor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.1",
    "streamlit[auth]>=1.50.0",
]

[project.scripts]
devops-final-frontend = "devops_final_frontend:main"
create-secrets-file = "devops_final_frontend.config:main"

[dependency-groups]
dev = [
    # Linters
    "ruff>=0.14.0",
    "pylint>=4.0.0",
    "myst-parser>=4.0.1",
    "mypy>=1.18.2",
    # Tests
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    # CI
    "pre-commit>=4.3.0",
    "types-toml>=0.10.8.20240310",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
fix = true
lint.extend-select = ["I"]
cache-dir = ".cache/ruff"

[tool.pylint]
ignore = ["venv", ".env", "build", "dist"]
disable = []
output-format = "colorized"
good-names = ["i", "j", "k", "ex", "Run", "_"]
max-line-length = 120
extension-pkg-whitelist = ["pydantic"]
ignored-modules = ["typing_extensions"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"

[tool.mypy]
explicit_package_bases = true
mypy_path = ["src"]
cache_dir = ".cache/mypy"
